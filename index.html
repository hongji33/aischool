<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Academy</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --tertiary: #FFE66D;
            --dark: #2D3436;
            --light: #636E72;
            --bg-light: #F8F9FA;
            --bg-white: #FFFFFF;
            --border: #DFE6E9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--dark);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-white);
            padding: 20px 40px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border-bottom: 2px solid var(--border);
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-main {
            display: flex;
            gap: 20px;
        }

        .nav-btn {
            background: none;
            border: 2px solid var(--border);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--light);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
        }

        .container {
            display: flex;
            height: calc(100vh - 90px);
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--bg-white) 0%, var(--bg-light) 100%);
            border-right: 2px solid var(--border);
            padding: 30px 20px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--light);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .week-btn {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg-white);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--dark);
        }

        .week-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-light);
        }

        .week-title {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 12px;
        }

        .week-subtitle {
            font-size: 18px;
            color: var(--light);
            margin-bottom: 30px;
        }

        .content-card {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .section-label {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
        }

        .section-description {
            font-size: 16px;
            line-height: 1.8;
            color: var(--light);
            white-space: pre-line;
            margin-bottom: 20px;
        }

        .step {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 12px;
            border-left: 4px solid var(--secondary);
            margin-bottom: 12px;
        }

        .step-number {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            min-width: 32px;
        }

        .step-title {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .step-description {
            font-size: 14px;
            color: var(--light);
            line-height: 1.6;
        }

        .code-block {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 16px 0;
            border: 1px solid var(--border);
        }

        .code-block code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--dark);
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .tip-box {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.1), rgba(255, 107, 107, 0.1));
            border-left: 4px solid var(--secondary);
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

        .tip-label {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .tip-text {
            font-size: 14px;
            color: var(--light);
            line-height: 1.6;
            white-space: pre-line;
        }

        .demo-app {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 24px;
            border: 2px solid var(--border);
            margin: 20px 0;
            text-align: center;
        }

        .demo-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.3);
        }

        .demo-button:hover {
            transform: translateY(-2px);
        }

        .demo-result {
            margin-top: 16px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .checklist {
            margin: 16px 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-light);
            border-radius: 8px;
            font-size: 14px;
        }

        .checklist-item input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎵 Vibe Coding</div>
        <nav class="nav-main">
            <button class="nav-btn active" onclick="changeLevel(0)">기초 바이브 코딩</button>
            <button class="nav-btn" onclick="changeLevel(1)">중급 바이브 코딩</button>
            <button class="nav-btn" onclick="changeLevel(2)">고급 바이브 코딩</button>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-title">📚 주차별 학습</div>
            <div id="weekButtons"></div>
        </aside>

        <main class="main-content">
            <div id="content"></div>
        </main>
    </div>

    <script>
